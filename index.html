<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mi Proyecto de Vida</title>
  <meta name="description" content="Metas, finanzas, ejercicio en casa y rutina de skincare en un solo lugar.">
  <meta name="theme-color" content="#0f766e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Mi Vida">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <h1 id="view-title">Hoy</h1>
    <button class="icon-btn" data-action="go" data-view="ajustes" aria-label="Ajustes">⚙️</button>
  </header>

  <main id="app" tabindex="-1"></main>

  <nav class="tabbar" aria-label="Secciones">
    <button data-action="go" data-view="hoy"><span>🏠</span>Hoy</button>
    <button data-action="go" data-view="metas"><span>🎯</span>Metas</button>
    <button data-action="go" data-view="finanzas"><span>💰</span>Finanzas</button>
    <button data-action="go" data-view="ejercicio"><span>💪</span>Ejercicio</button>
    <button data-action="go" data-view="piel"><span>🧴</span>Skincare</button>
  </nav>

  <dialog id="modal">
    <form method="dialog" id="modal-form"></form>
  </dialog>

  <div id="toast" role="status" aria-live="polite"></div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
